# SSG Voting System — single site, single origin.
#   /          -> React SPA: admin console + student portal (admin-web/dist)
#   /api/      -> Node backend on 127.0.0.1:5000
#   /uploads/  -> candidate photos served by the Node backend
#
# Install: /etc/nginx/sites-available/voting.conf  (symlink into sites-enabled)
# Replace ssgvote.duckdns.org with your real hostname before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name ssgvote.duckdns.org;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ssgvote.duckdns.org;

    # Stable paths that do not depend on which ACME client issued the cert.
    # acme.sh writes here directly; certbot users symlink /etc/letsencrypt.
    ssl_certificate     /etc/ssl/voting/fullchain.pem;
    ssl_certificate_key /etc/ssl/voting/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Built by deploy.sh straight from the git clone — nothing is copied around.
    root  /opt/voting/app/admin-web/dist;
    index index.html;

    # Student Excel import and candidate photos travel through here; the Node
    # side caps JSON at 2 MB on its own.
    client_max_body_size 12M;

    access_log /var/log/nginx/voting.access.log;
    error_log  /var/log/nginx/voting.error.log;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Candidate photos are written to backend/uploads by multer and served by
    # Express, so they proxy the same way the API does.
    location /uploads/ {
        proxy_pass       http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hashed build assets ──────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React SPA (admin console at /dashboard…, students at /student/…) ─────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
